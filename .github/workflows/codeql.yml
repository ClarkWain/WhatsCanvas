name: codeql

on:
  push:
    branches: [ master, 1.1.0 ]
  pull_request:
    branches: [ master, 1.1.0 ]
  schedule:
    # Weekly full scan even without changes so newly published CodeQL queries
    # find pre-existing patterns.
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      # Use the security-extended pack in addition to the default query pack so
      # deeper CWE-like patterns (null-dereference, UAF, integer overflow) are
      # analyzed. `security-and-quality` also adds C++ Core Guidelines checks.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Configure
        run: >-
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug
          -DWHATSCANVAS_BUILD_DEMO=OFF
          -DWHATSCANVAS_ENABLE_SCRIPT_TESTS=OFF
          -DWHATSCANVAS_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-codeql --config Debug -j 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
