name: Package WhatsCanvas

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            os_id: win64
            config: Release
            cmake_extra: ''
          - os: ubuntu-latest
            os_id: linux-x64
            config: Release
            cmake_extra: ''
          - os: macos-latest
            os_id: macos-universal
            config: Release
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WHATSCANVAS_BUILD_DIR: ${{ github.workspace }}\build-github-win
          WHATSCANVAS_CMAKE_GENERATOR: NMake Makefiles
          WHATSCANVAS_CMAKE_MULTI_CONFIG: '0'
          WHATSCANVAS_CMAKE_PLATFORM: ''
          WHATSCANVAS_CMAKE_TOOLSET: ''
        run: |
          cmd /c build.bat --release --package --no-run --shared --opengles --vulkan

      - name: Build package on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          WHATSCANVAS_CMAKE_EXTRA_ARGS: ${{ matrix.cmake_extra }}
        run: |
          chmod +x build.sh
          ./build.sh --release --package --no-run

      - name: Check version consistency on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c scripts\version_consistency_check.bat

      - name: Check version consistency on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/version_consistency_check.sh
          ./scripts/version_consistency_check.sh

      - name: Check public performance evidence
        run: python scripts/performance_claims_check.py

      - name: Verify package consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c scripts\package_consumer_smoke.bat

      - name: Verify package consumer on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/package_consumer_smoke.sh
          ./scripts/package_consumer_smoke.sh

      - name: Archive package
        id: archive
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\s*\(\s*WhatsCanvas\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to read WhatsCanvas version from CMakeLists.txt"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag/version mismatch: ref is '$($env:GITHUB_REF_NAME)', CMake version requires '$expectedTag'"
            }
          }
          $configLower = "${{ matrix.config }}".ToLowerInvariant()
          $artifactName = "whatscanvas-${{ matrix.os_id }}-$configLower-$version"
          $archivePath = Join-Path $PWD "$artifactName.zip"
          Compress-Archive -Path "out/package/${{ matrix.config }}/*" -DestinationPath $archivePath -Force
          "archive=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.archive }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.archive }}

  android-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.1' 'ndk;21.4.7075529' 'cmake;3.18.1'

      - name: Build installable Profile demo and run lint
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleProfile :app:lintProfile

      - name: Name Android artifact
        id: android_archive
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\s*\(\s*WhatsCanvas\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to read WhatsCanvas version from CMakeLists.txt"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag/version mismatch: ref is '$($env:GITHUB_REF_NAME)', CMake version requires 'v$version'"
          }
          $artifactName = "whatscanvas-android-demo-profile-$version"
          $artifactPath = Join-Path $PWD "$artifactName.apk"
          Copy-Item platforms/android/app/build/outputs/apk/profile/app-profile.apk $artifactPath
          "artifact=$artifactPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Android workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.android_archive.outputs.artifact_name }}
          path: ${{ steps.android_archive.outputs.artifact }}

      - name: Upload Android release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.android_archive.outputs.artifact }}
