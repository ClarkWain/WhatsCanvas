name: Package WhatsCanvas

on:
  push:
    branches:
      - master
    tags:
      - "v0.1.*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_id: win64
            config: Release
          - os: ubuntu-latest
            os_id: linux-x64
            config: Release
          - os: macos-latest
            os_id: macos-universal
            config: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c build.bat --release --package --no-run

      - name: Build package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh --release --package --no-run

      - name: Archive package
        id: archive
        shell: pwsh
        run: |
          $version = "0.1.10"
          $configLower = "${{ matrix.config }}".ToLowerInvariant()
          $artifactName = "whatscanvas-${{ matrix.os_id }}-$configLower-$version"
          $archivePath = Join-Path $PWD "$artifactName.zip"
          Compress-Archive -Path "out/package/${{ matrix.config }}/*" -DestinationPath $archivePath -Force
          "archive=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.archive }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.archive }}