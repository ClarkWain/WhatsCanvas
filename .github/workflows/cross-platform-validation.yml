name: Cross-Platform Validation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  api-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check generated API reference
        run: |
          chmod +x scripts/api_reference_check.sh
          ./scripts/api_reference_check.sh

      - name: Check version consistency
        run: |
          chmod +x scripts/version_consistency_check.sh
          ./scripts/version_consistency_check.sh

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_dir: build-validation-win
            shell: pwsh
          - os: ubuntu-latest
            build_dir: build-validation-linux
            shell: bash
          - os: macos-latest
            build_dir: build-validation-macos
            shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B ${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config Debug

      - name: Unit tests
        run: ctest --test-dir ${{ matrix.build_dir }} -C Debug -L unit --output-on-failure

      # Keep Metal visible as a first-class blocking gate. These tests are also
      # part of the unit label, but the explicit Apple-only run prevents a
      # future label/configuration change from silently dropping GPU coverage.
      - name: Metal backend tests
        if: runner.os == 'macOS'
        run: ctest --test-dir ${{ matrix.build_dir }} -C Debug -L metal --output-on-failure

  opengles-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
                                  libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb gdb

      - name: OpenGLES build smoke
        run: |
          chmod +x scripts/opengles_build_smoke.sh
          ./scripts/opengles_build_smoke.sh

      - name: OpenGLES filter pixel parity on Mesa EGL
        run: |
          set +e
          xvfb-run -a env WHATSCANVAS_REQUIRE_GL_CONTEXT=1 \
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            ctest --test-dir build-gles-check -C Debug \
              -R '^WhatsCanvasOpenGLESFilterPixelParityTests$' --output-on-failure
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "OpenGLES parity failed; collecting a non-interactive backtrace"
            xvfb-run -a env WHATSCANVAS_REQUIRE_GL_CONTEXT=1 \
              LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
              gdb --batch -ex run -ex 'thread apply all backtrace' --args \
                ./build-gles-check/WhatsCanvasOpenGLESFilterPixelParityTests || true
            exit "$status"
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.1' 'ndk;21.4.7075529' 'cmake;3.18.1'

      # Current Android command-line tools require JDK 17 to install SDK
      # packages, while the pinned AGP 7.2 / Gradle 7.4 build is validated on
      # JDK 11. Install the SDK before switching the job's active Java runtime.
      - name: Set up Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build all packaged ABIs and run lint
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DWHATSCANVAS_BUILD_DEMO=OFF -DWHATSCANVAS_ENABLE_SCRIPT_TESTS=OFF
          -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizer targets
        run: cmake --build build-sanitizers --config Debug -j 2

      - name: Run sanitizer unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers -C Debug -L unit --output-on-failure

  fuzzing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure fuzz target
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DWHATSCANVAS_BUILD_FUZZERS=ON -DWHATSCANVAS_BUILD_DEMO=OFF
          -DWHATSCANVAS_BUILD_BENCHMARKS=OFF -DWHATSCANVAS_ENABLE_SCRIPT_TESTS=OFF
          -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'

      - name: Build fuzz target
        run: cmake --build build-fuzz --target WhatsCanvasTextAndFontConfigFuzzer -j 2

      - name: Run bounded fuzz smoke
        run: |
          mkdir -p build-fuzz/corpus
          cp tests/fuzz/corpus/text/* build-fuzz/corpus/
          cp tests/fixtures/android_font_config/*.xml build-fuzz/corpus/
          ./build-fuzz/WhatsCanvasTextAndFontConfigFuzzer build-fuzz/corpus -runs=20000 -max_len=1048576 -timeout=10

  opengl-filter-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Mesa and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev \
                                  libxcursor-dev libxi-dev xvfb

      - name: Configure filter validation
        run: cmake -S . -B build-filter-parity -DCMAKE_BUILD_TYPE=Release -DWHATSCANVAS_BUILD_DEMO=OFF -DWHATSCANVAS_ENABLE_SCRIPT_TESTS=OFF

      - name: Build filter parity and benchmark targets
        run: cmake --build build-filter-parity --config Release --target WhatsCanvasOpenGLFilterPixelParityTests WhatsCanvasImageFilterBenchmarks WhatsCanvasPerformanceSuite

      - name: OpenGL filter pixel parity on llvmpipe
        run: |
          xvfb-run -a env WHATSCANVAS_REQUIRE_GL_CONTEXT=1 \
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            ctest --test-dir build-filter-parity -C Release \
              -R '^WhatsCanvasOpenGLFilterPixelParityTests$' --output-on-failure

      - name: Software filter benchmark smoke
        run: |
          ./build-filter-parity/WhatsCanvasImageFilterBenchmarks \
            --backend software --warmup 1 --frames 2 --width 320 --height 180

      - name: Unified performance suite schema smoke
        run: |
          ./build-filter-parity/WhatsCanvasPerformanceSuite \
            --backend software --profile quick \
            --scene solid_rects,path_cached,image_grid \
            --width 320 --height 180 \
            --output build-filter-parity/performance-smoke.jsonl
          python3 scripts/compare_performance.py \
            --validate build-filter-parity/performance-smoke.jsonl

  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build package and verify external CMake consumer
        run: |
          chmod +x build.sh scripts/package_consumer_smoke.sh
          ./build.sh --release --package --no-run
          ./scripts/package_consumer_smoke.sh

  cmake-release-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure release validation targets
        run: cmake -S . -B build-validation-release-targets -DCMAKE_BUILD_TYPE=Debug

      - name: Check API reference target
        run: cmake --build build-validation-release-targets --target WhatsCanvasCheckApiReference

      - name: Check version consistency target
        run: cmake --build build-validation-release-targets --target WhatsCanvasCheckVersionConsistency

      - name: Check performance evidence target
        run: cmake --build build-validation-release-targets --target WhatsCanvasCheckPerformanceClaims

      - name: Check package consumer target
        run: cmake --build build-validation-release-targets --target WhatsCanvasCheckPackageConsumer

  default-font-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install text shaping dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libharfbuzz-dev libfreetype-dev

      - name: Configure the default text stack
        run: cmake -S . -B build-validation-font-stack -DCMAKE_BUILD_TYPE=Debug

      - name: Build the default text stack
        run: cmake --build build-validation-font-stack --config Debug

      - name: Text unit tests with the default text stack
        run: ctest --test-dir build-validation-font-stack -C Debug -L text --output-on-failure

      - name: Font benchmark smoke
        run: WHATSCANVAS_BENCHMARK_ITERATIONS=20 ./build-validation-font-stack/WhatsCanvasCoreBenchmarks

  vulkan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan loader, headers, and software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
                                  libvulkan-dev vulkan-tools mesa-vulkan-drivers

      - name: Configure with the Vulkan backend enabled
        run: cmake -S . -B build-validation-vulkan -DCMAKE_BUILD_TYPE=Debug -DWHATSCANVAS_ENABLE_VULKAN=ON

      # Build gate: the embedded SPIR-V shaders and Vulkan translation must
      # compile and link. This catches Vulkan-side regressions in every PR
      # without requiring GPU hardware.
      - name: Build the Vulkan backend
        run: cmake --build build-validation-vulkan --config Debug

      - name: Vulkan filter pixel parity on lavapipe
        run: |
          LVP_ICD=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"
          vulkaninfo --summary
          ctest --test-dir build-validation-vulkan -C Debug \
            -R '^WhatsCanvasVulkanFilterPixelParityTests$' --output-on-failure

      # Best-effort execution on the Mesa "lavapipe" software Vulkan device.
      # Non-blocking: software-rasterizer limitations must not fail the gate,
      # but a green run gives real render coverage on the hosted runner.
      - name: Run Vulkan tests on lavapipe (informational)
        continue-on-error: true
        run: |
          LVP_ICD=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          export VK_DRIVER_FILES="$LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"
          vulkaninfo --summary || true
          ctest --test-dir build-validation-vulkan -C Debug -L vulkan --output-on-failure
