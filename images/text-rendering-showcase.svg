<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">WhatsCanvas text rendering showcase</title>
  <desc id="desc">A visual overview of multilingual text, font fallback, shaping, bidi, stroke text, shadows, text boxes, and glyph atlas rendering capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#172033"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="5" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", "Noto Sans", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
      .label { fill: #94a3b8; font-size: 18px; font-weight: 600; }
      .caption { fill: #cbd5e1; font-size: 17px; }
      .small { fill: #94a3b8; font-size: 14px; }
      .card { fill: #0f172a; fill-opacity: 0.78; stroke: #94a3b8; stroke-opacity: 0.22; stroke-width: 1.2; }
      .rule { stroke: #94a3b8; stroke-opacity: 0.25; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <path d="M0 620 C180 560 270 690 440 640 C610 590 720 515 930 560 C1100 598 1170 640 1280 588 L1280 760 L0 760 Z" fill="#0f766e" opacity="0.12"/>
  <path d="M0 115 C150 80 260 120 380 96 C520 68 650 46 820 84 C990 122 1120 85 1280 42" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>

  <text x="54" y="68" class="sans" font-size="34" font-weight="800" fill="#f8fafc">WhatsCanvas Text Rendering</text>
  <text x="54" y="102" class="sans" font-size="18" fill="#cbd5e1">Multilingual layout, fallback, shaping, Bidi, atlas text, stroke, shadow, and color glyph layers</text>
  <rect x="1020" y="44" width="206" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="1040" y="71" class="mono" font-size="16" fill="#67e8f9">UAX #9: 861,948/0</text>

  <rect class="card" x="54" y="142" width="360" height="190" filter="url(#softShadow)"/>
  <text x="78" y="178" class="label sans">Stroke + shadow</text>
  <text x="78" y="244" class="sans" font-size="52" font-weight="900" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2.4" paint-order="stroke fill" filter="url(#textShadow)">Canvas</text>
  <text x="80" y="286" class="caption sans">Fill and stroke text share the same layout path.</text>
  <text x="80" y="309" class="small mono">Paint: fill / stroke / shadow</text>

  <rect class="card" x="460" y="142" width="360" height="190" filter="url(#softShadow)"/>
  <text x="484" y="178" class="label sans">Fallback + multilingual</text>
  <text x="484" y="232" class="sans" font-size="36" font-weight="800" fill="url(#accent)">Hello 你好 مرحبا</text>
  <text x="484" y="274" class="sans" font-size="32" font-weight="700" fill="#f8fafc">Latin / CJK / Arabic</text>
  <text x="484" y="309" class="small mono">FontManager + fallback chain</text>

  <rect class="card" x="866" y="142" width="360" height="190" filter="url(#softShadow)"/>
  <text x="890" y="178" class="label sans">Bidi + shaping</text>
  <text x="890" y="227" class="sans" font-size="31" font-weight="700" fill="#f8fafc">abc 123 אבג مرحبا 456</text>
  <line x1="890" y1="252" x2="1190" y2="252" class="rule"/>
  <text x="890" y="285" class="caption sans">Mixed direction runs keep numbers readable.</text>
  <text x="890" y="309" class="small mono">Unicode Bidi + HarfBuzz optional</text>

  <rect class="card" x="54" y="374" width="360" height="230" filter="url(#softShadow)"/>
  <text x="78" y="410" class="label sans">Text box layout</text>
  <rect x="78" y="430" width="310" height="120" rx="6" fill="#111827" stroke="#334155"/>
  <text x="98" y="463" class="sans" font-size="23" fill="#f8fafc">UTF-8 safe text box</text>
  <text x="98" y="494" class="sans" font-size="23" fill="#f8fafc">中文不依赖空格换行</text>
  <text x="98" y="525" class="sans" font-size="23" fill="#f8fafc">long-token-wrap...</text>
  <text x="80" y="579" class="small mono">line height / max lines / ellipsis</text>

  <rect class="card" x="460" y="374" width="360" height="230" filter="url(#softShadow)"/>
  <text x="484" y="410" class="label sans">Glyph atlas</text>
  <rect x="488" y="436" width="214" height="118" rx="4" fill="#0f172a" stroke="#334155"/>
  <g transform="translate(500 448)">
    <rect width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="34" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="68" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="102" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="136" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="170" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect y="34" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="34" y="34" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="68" y="34" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="102" y="34" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="136" y="34" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <rect x="170" y="34" width="28" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="6" y="23" class="sans" font-size="23" fill="#e2e8f0">A</text>
    <text x="39" y="23" class="sans" font-size="23" fill="#e2e8f0">g</text>
    <text x="72" y="23" class="sans" font-size="23" fill="#e2e8f0">你</text>
    <text x="107" y="23" class="sans" font-size="23" fill="#e2e8f0">好</text>
    <text x="142" y="23" class="sans" font-size="23" fill="#e2e8f0">م</text>
    <text x="176" y="23" class="sans" font-size="23" fill="#e2e8f0">ب</text>
    <circle cx="14" cy="48" r="9" fill="#60a5fa"/>
    <circle cx="48" cy="48" r="9" fill="#f472b6"/>
    <circle cx="82" cy="48" r="9" fill="#34d399"/>
    <circle cx="116" cy="48" r="9" fill="#fbbf24"/>
  </g>
  <text x="722" y="474" class="sans" font-size="26" font-weight="800" fill="#f8fafc">Persistent</text>
  <text x="722" y="508" class="sans" font-size="26" font-weight="800" fill="#f8fafc">dirty rects</text>
  <text x="484" y="579" class="small mono">alpha atlas + RGBA atlas</text>

  <rect class="card" x="866" y="374" width="360" height="230" filter="url(#softShadow)"/>
  <text x="890" y="410" class="label sans">Color glyph layers</text>
  <g transform="translate(900 440)">
    <circle cx="60" cy="60" r="54" fill="#fef3c7"/>
    <path d="M60 8 L74 43 L112 45 L82 68 L92 105 L60 84 L28 105 L38 68 L8 45 L46 43 Z" fill="url(#warm)" stroke="#7c2d12" stroke-width="2"/>
    <circle cx="60" cy="60" r="18" fill="#0f172a" opacity="0.9"/>
    <path d="M60 37 L66 54 L84 54 L70 65 L75 82 L60 72 L45 82 L50 65 L36 54 L54 54 Z" fill="#5eead4"/>
  </g>
  <text x="1028" y="475" class="sans" font-size="28" font-weight="800" fill="#f8fafc">COLR/CPAL</text>
  <text x="1028" y="513" class="sans" font-size="26" font-weight="700" fill="#cbd5e1">layered RGBA</text>
  <text x="890" y="579" class="small mono">table detection + compositing</text>

  <rect x="54" y="646" width="1172" height="62" rx="8" fill="#020617" opacity="0.62" stroke="#1e293b"/>
  <text x="78" y="684" class="sans" font-size="22" font-weight="700" fill="#f8fafc">One text path:</text>
  <text x="230" y="684" class="sans" font-size="22" fill="#cbd5e1">UTF-8 layout, fallback, shaping, rasterization, atlas upload, Canvas draw, diagnostics, and conformance tests.</text>
</svg>
