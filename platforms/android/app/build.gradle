apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.whatscanvas.demo'
    compileSdkVersion = "${compile_sdk_version}" as Integer
    buildToolsVersion = "${build_tools_version}"
    ndkVersion "${ndk_version}"

    defaultConfig {
        applicationId 'com.whatscanvas.demo'
        minSdkVersion "${min_sdk_version}" as Integer
        targetSdkVersion "${target_sdk_version}" as Integer
        versionCode 8
        versionName '0.8.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-fexceptions', '-frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        profile {
            // Installable profiling build: keep symbols/run-as access while
            // overriding Debug's -O0 native default. This mirrors the split
            // used by mature UI engines: Debug for correctness, Profile for
            // representative on-device performance, Release for shipping.
            initWith release
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            externalNativeBuild {
                cmake {
                    arguments '-DWHATSCANVAS_ANDROID_PROFILE=ON'
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "${cmake_version}"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
