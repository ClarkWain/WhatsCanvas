pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "WhatsCanvasAndroid"
include ':app'
include ':spider'
include ':whatscanvas'
project(':whatscanvas').projectDir = file('sdk')
if (System.getenv('WHATSCANVAS_ENABLE_SDK_CONSUMER_SMOKE') == '1') {
    include ':sdk-consumer-smoke'
}
