site_name: WhatsCanvas
site_description: A lightweight, embeddable, verifiable C++17 2D Canvas renderer — OpenGL / OpenGL ES / pure-CPU software / optional Vulkan.
site_url: https://clarkwain.github.io/WhatsCanvas/
repo_url: https://github.com/ClarkWain/WhatsCanvas
repo_name: ClarkWain/WhatsCanvas
copyright: Documentation built from the WhatsCanvas repository docs.

# Reuse the existing repository docs in place (no duplication). Internal notes
# are kept out of the site via exclude_docs below; the public pages are curated
# in nav. Root-level images/ are staged into the site by mkdocs_hooks.py.
docs_dir: doc/public

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - mkdocs_hooks.py

# Several public pages intentionally link to source files and benchmark evidence
# outside docs_dir. MkDocs cannot copy those targets, so report them as
# informational while repository-level link checks validate the real paths.
validation:
  links:
    not_found: info
    unrecognized_links: info

